name: Handle Telemetry Alert

on:
  repository_dispatch:
    types: [telemetry_alert]

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DISPATCH_PAT }}

      - name: Checkout Relay framework
        uses: actions/checkout@v4
        with:
          repository: ChristianJensen/Relay
          path: _relay
          token: ${{ secrets.DISPATCH_PAT }}

      - name: Write payload to file
        run: echo '${{ toJSON(github.event.client_payload) }}' > /tmp/payload.json

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Ingest telemetry alert and generate bug spec
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          RELAY_AGENT: claude
        run: |
          python3 _relay/process/scripts/handle-telemetry.py \
            --payload-file /tmp/payload.json \
            --cp-dir "$GITHUB_WORKSPACE"

      - name: Push bug spec
        run: |
          git config user.name "relay-bot[bot]"
          git config user.email "relay-bot[bot]@users.noreply.github.com"
          git push
