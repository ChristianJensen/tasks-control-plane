name: Dispatch Agent Fix

on:
  workflow_dispatch:
    inputs:
      bug_slug:
        description: 'Bug slug to plan and dispatch (e.g., cannot-read-properties-of-undefined-reading-id)'
        required: true

jobs:
  plan-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DISPATCH_PAT }}

      - name: Checkout Relay framework
        uses: actions/checkout@v4
        with:
          repository: ChristianJensen/Relay
          path: _relay
          token: ${{ secrets.DISPATCH_PAT }}

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Plan bug fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          RELAY_AGENT: claude
        run: |
          python3 _relay/process/scripts/plan.py \
            ${{ inputs.bug_slug }} \
            --cp-dir "$GITHUB_WORKSPACE" \
            --non-interactive

      - name: Commit and push
        run: |
          git config user.name "relay-bot[bot]"
          git config user.email "relay-bot[bot]@users.noreply.github.com"
          echo "=== Git status ==="
          git status --short
          git add bugs/ queue/ contracts/
          git diff --cached --stat
          git commit -m "fix: agent dispatch — plan and queue for ${{ inputs.bug_slug }}" || echo "Nothing to commit"
          git push
