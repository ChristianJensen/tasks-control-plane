name: Set Execution Mode

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Feature or bug slug (e.g., user-profile-redesign-feature)'
        required: true
      execution_mode:
        description: 'Execution mode: autonomous, supervised, or guided'
        required: true
        type: choice
        options:
          - autonomous
          - supervised
          - guided

jobs:
  update-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DISPATCH_PAT }}

      - name: Update execution mode on queue tasks
        run: |
          SLUG="${{ inputs.slug }}"
          MODE="${{ inputs.execution_mode }}"
          echo "Setting execution mode to '$MODE' for '$SLUG'"

          # Find all queue task files for this slug
          for task_file in queue/"$SLUG"/*/wave-*.md; do
            [ -f "$task_file" ] || continue
            echo "  Updating: $task_file"
            # Replace execution field in frontmatter
            sed -i "s/^execution:.*/execution: $MODE/" "$task_file"
          done

      - name: Commit and push
        run: |
          git config user.name "relay-bot[bot]"
          git config user.email "relay-bot[bot]@users.noreply.github.com"
          git add queue/
          git diff --cached --stat
          git commit -m "fix: set execution mode to ${{ inputs.execution_mode }} for ${{ inputs.slug }}" || echo "Nothing to commit"
          git push

      - name: Trigger agent dispatch
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          gh workflow run dispatch-agents.yml --repo "${{ github.repository }}" --ref main
