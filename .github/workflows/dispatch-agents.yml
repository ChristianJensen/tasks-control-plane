# Dispatch Agents — scans the task queue and fires repository_dispatch events
# to target code repos with parallel instance counts.
#
# Synced to control planes by upgrade.sh. Requires: DISPATCH_PAT secret.

name: Dispatch Agents
on:
  push:
    branches: [main]
    paths: ['queue/**']
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan queue and dispatch agents
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: python3 scripts/dispatch-agents.py --cp-dir "$GITHUB_WORKSPACE"
